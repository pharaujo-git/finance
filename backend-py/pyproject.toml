[project]
name = "finance-api-py"
version = "0.1.0"
description = "FastAPI implementation of the Finance Tracker API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pyjwt>=2.9",
    # The CSV import endpoint takes a multipart upload.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# Relative paths so the XML resolves on any machine: an absolute <source> from
# a developer's laptop means nothing to the scanner running in CI.
relative_files = true
source = ["app"]

[tool.mypy]
python_version = "3.12"
# Not `strict`: the DTOs are deliberately plain dicts so the JSON shape stays
# under this code's control rather than a serialiser's, and strict mode mostly
# objects to that choice. These checks still catch the mistakes that matter.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
