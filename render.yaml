# Render Blueprint for the Finance Tracker APIs (.NET, Go, Python, Node and Rails).
# Dashboard: New -> Blueprint -> connect this repo. See docs/DEPLOYMENT.md.
#
# All five services are identical in shape: same Dockerfile pattern, same
# database, same shared secret, same health check. They differ only in which
# implementation they build.
#
# region is `virginia` (us-east-1) so the APIs sit next to the Neon project,
# which lives in us-east-1. Render CANNOT change a service's region after
# creation -- moving later means deleting and recreating all five, so this has
# to be right before the blueprint is first applied.
services:
  - type: web
    name: finance-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The Neon POOLED connection string, set per service in the dashboard.
      # It cannot move into finance-shared below: Render does not accept
      # `sync: false` inside an environment group. Use the pooled (`-pooler`)
      # host here -- only dbmate needs the direct one.
      - key: DATABASE_URL
        sync: false
      # JWT_SECRET and ALLOWED_ORIGINS, identical across all five services.
      - fromGroup: finance-shared

  # Second implementation of the same API, same database, same tokens. The
  # frontend picks between them at run time
  # (VITE_API_URL_DOTNET / _GO / _PYTHON / _NODE / _RAILS).
  - type: web
    name: finance-api-go
    runtime: docker
    dockerfilePath: ./backend-go/Dockerfile
    dockerContext: ./backend-go
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - fromGroup: finance-shared

  # Third implementation, on the same terms as the other two.
  - type: web
    name: finance-api-py
    runtime: docker
    dockerfilePath: ./backend-py/Dockerfile
    dockerContext: ./backend-py
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - fromGroup: finance-shared

  # Fourth implementation, on the same terms as the other three.
  - type: web
    name: finance-api-node
    runtime: docker
    dockerfilePath: ./backend-node/Dockerfile
    dockerContext: ./backend-node
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - fromGroup: finance-shared

  # Fifth implementation, on the same terms as the other four.
  - type: web
    name: finance-api-rb
    runtime: docker
    dockerfilePath: ./backend-rb/Dockerfile
    dockerContext: ./backend-rb
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - fromGroup: finance-shared

# Shared configuration. `- fromGroup: <name>` attaches every variable in the
# group to the service, so all five APIs receive the same values.
#
# A group takes literal values and generated ones, but NOT `sync: false` --
# which is why DATABASE_URL is declared per service above, and everything that
# can be shared is shared here.
envVarGroups:
  - name: finance-shared
    envVars:
      # Generated once by Render and kept across deploys. Every service must see
      # the same value, or a token minted by one is rejected by the other four.
      #
      # This used to carry a warning about seeding the group from finance-api's
      # existing per-service secret. That no longer applies: the Neon database
      # was empty until CI's first migration, so there are no accounts and no
      # issued tokens for a fresh secret to invalidate.
      - key: JWT_SECRET
        generateValue: true
      # Both stable production aliases of the Vercel project. Origins only --
      # scheme and host, no trailing slash, comma separated. A preview
      # deployment gets a URL that is not listed here and will be refused by
      # CORS; add it here or in the dashboard if a preview needs the APIs.
      - key: ALLOWED_ORIGINS
        value: https://finance-beta-umber.vercel.app,https://finance-pharaujo1.vercel.app
